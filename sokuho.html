N, Nov. 18 (Xinhua) -- Chinese President Xi Jinping and his wife, Peng Liyuan, on Wednesday hosted a banquet in Shenzhen, south China's Guangdong Province, to welcome guests who are here to attend the 33rd Asia-Pacific Economic Cooperation (APEC) Economic Leaders' Meeting.", "s": "歓迎宴"}, {"t": "19:09", "d": "18", "c": ["米", "中"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/0a4e36dfed5048bf9c99336936268887/c.html", "ja": "習近平国家主席、トランプ米大統領を空港で出迎え（再掲）", "o": "习近平迎接美国总统特朗普", "s": "到着・出迎え"}, {"t": "19:14", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTILfB63rU2wIFE79qncjeC261118.shtml", "ja": "習近平国家主席と彭麗媛夫人が歓迎宴を開く（新華社と同文）", "o": "新华社快讯：11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。", "s": "歓迎宴"}, {"t": "19:27", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/9c71aa0a68a840009e80ae6eb1e9299a/c.html", "ja": "宴会の前に、習近平主席夫妻が各エコノミーの首脳・代表・配偶者と集合写真を撮影（第1報、続報待ち）", "o": "新华社深圳11月18日电（记者董雪、梁希之）11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n宴会开始前，习近平主席夫妇同各经济体领导人、代表及配偶集体合影。", "s": "歓迎宴"}, {"t": "19:27", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIt4pOjTmKDrNwRJTAKNDD261118.shtml", "ja": "宴会前に習近平主席夫妻が各首脳らと集合写真（新華社と同文）", "o": "新华社深圳11月18日电（记者董雪、梁希之）11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n宴会开始前，习近平主席夫妇同各经济体领导人、代表及配偶集体合影。", "s": "歓迎宴"}, {"t": "18:58", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330839", "ja": "ペスコフ大統領報道官：プーチン氏とトランプ氏は今夜（歓迎宴で）顔を合わせ、「きっと言葉を交わすだろう」", "o": "Песков: Путин и Трамп \"наверняка перекинутся фразами\" во время встречи\n（同日配信の関連記事「Песков: Путин и Трамп увидятся вечером」リード：Как отметил представитель Кремля, президенты РФ и США \"наверняка перекинутся фразами\"）", "s": "歓迎宴"}, {"t": "19:33", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330921", "ja": "プーチン氏、APEC首脳の歓迎レセプションでトランプ氏と言葉を交わす（速報）", "o": "Путин пообщался с Трампом на приеме в честь участников саммита АТЭС", "s": "歓迎宴"}, {"t": "19:35", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28330933", "ja": "プーチン氏とトランプ氏が握手（速報）", "o": "Путин и Трамп пожали друг другу руки", "s": "歓迎宴"}, {"t": "19:32", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIz0JAzNNntuRmAjYclm90261118.shtml", "ja": "【映像】CCTV康輝キャスターが開宴前の会場（深圳国際交流中心）を紹介。テーマは「一湾錦繍通亜太」。集合写真の背景は深圳湾の全景。休憩エリアに嶺南の無形文化遺産6点と深圳の科学技術製品15点（計21＝APEC21エコノミー）。宴会場には上海・北京・深圳の3つのAPEC開催都市を描いた長いテーブル", "o": "（動画の文字起こし・機械処理）\n大国外交最前线。大家好,我是康辉。深圳的夜色将至。我从浅海国际会议中心来到了位于乡密湖畔的深圳国际交流中心。今天晚上,习近平主席夫妇在这里要为出席亚太经合组织领导人非正式会议的所有成员经济体的领导人代表举行欢迎宴会。APEC大家庭要在深圳实现首次团聚了。来到深圳就能感受到这真的是一座奇迹之城。今晚的欢迎宴会据说也实时处处有惊奇有惊喜。您知道2008年的时候联合国教科文组织曾经授予深圳设计之都的荣誉吗?而今晚的欢迎宴会就很有设计。设计的理念是一句非常优美的话,叫做一湾锦绣通亚太。那么到底设计理念是如何体现的呢?我们提前到宴会的现场去看一看。APEC大家庭在深圳首次团聚当然要留下第一张全家服。看这就是合影的地方。背景是看向深圳湾的一个全景的视角。高楼林立勾画出了错落有致的城市天际线。而大片的绿色那是中国唯一一个在城市中心区建立的国家级自然保护区。深圳浮田洪树林国家级自然保护区。山海之上城市之美生态之美相得一张,这不就是一湾锦绣吗?而APEC大家庭在这里留下深圳APEC的第一张全家服。这就是一湾锦绣通亚太。这个区域是贵宾们抵达后在合影之前稍是休息的地方。这里布置的岭南国家级的飞移。你看潮秀名副其实的锦绣吧。还有三百亿年历史的广彩词。石湾桃素红丽姐姐高,真的是林郎满目锦绣蒲面。而这边是另一番科技创新的林郎满目锦绣蒲面了。你看这是全球首家超级智能钢琴。贵宾们只要选择具有自己经济体特色的音乐,那么这架钢琴就会自动弹给你听。端起会微笑的杯子尝尝机器人做的咖啡,微笑美口快乐每一天。还可以认识一下创造了百米八秒八三世界纪录的机器人飞人。所以在这里展示的深圳的科技产品一共有15件,而在那边的岭南级国家飞移是6件,你盖得到了吗?15加6等于21,寓意着APEC的21个成员经济体,通过科技人文互联互通,共促繁荣。你看在这里就是这样实现异湾锦绣童雅泰的。走进欢迎宴会的宴会厅,看到这张长长的宴会桌了吗?这桌上的设置最直观的体现了异湾锦绣童雅泰。徐徐铺展开的一幅中国山水长卷,在繁华演映当中一弯流水弯颜穿过。而在这里我们可以看到上海的御源,北京的天潭,深圳的神中通道和洪树林,潮起上海潮距北京潮永深圳。这三座APEC之城也见证了中国之余APEC从参与到推动,再到引领。这就是异湾锦绣通雅泰,相信贵宾们能够充分地感受到,这一弯是雅泰陆海相连的地理扭带,这仅秀是雅泰多元文明的交織共荣,这一通是雅泰大家庭,经贸的互联互通更是人文相通,心领相通。在今晚的欢迎宴会上,习近平主席将发表热情扬议的致辞,大国外交最前线,我们和您一起关注。", "s": "歓迎宴"}, {"t": "19:44", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28330955", "ja": "ウシャコフ大統領補佐官：ロシアは中国・米国との首脳会談で「カードゲームはしない」。ロシアは三者首脳会談のために来たと述べた", "o": "Ушаков: Россия не будет \"играть в карты\" на саммите с КНР и США\nПомощник российского лидера отметил, что РФ приехала на трехстороннюю встречу на высшем уровне", "s": "米中ロ会談"}, {"t": "19:52", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/5c05d7ee35474b478d171442d22327ef/c.html", "ja": "習近平主席の乾杯の辞（全文）：「50年の中国を見るなら深圳へ」。1978年に初めて訪れた深圳は小さな漁村だったと回想。開放・イノベーション・協力を強調し、明日の首脳会議で相互開放拡大の措置などを議論すると表明。日米ロ韓など個別国への言及なし", "o": "新华社深圳11月18日电\n在亚太经合组织第三十三次领导人非正式会议欢迎晚宴上的祝酒辞\n（2026年11月18日，深圳）\n中华人民共和国主席　习近平\n各位同事，\n各位来宾，\n女士们，先生们，朋友们：\n大家晚上好！\n今晚，南海之滨灯火璀璨，鹏城深圳秋意盎然。在亚太经合组织第三十三次领导人非正式会议即将召开之际，我谨代表中国政府和中国人民，对各位嘉宾的到来表示热烈欢迎。\n我曾讲过，看千年的中国去西安，看五百年的中国去北京，看一百年的中国去上海。今天，我想对大家说，看五十年的中国就来深圳。\n深圳是一个有大故事的地方。1978年，我第一次到深圳，看到的还是一个小渔村。弹指间40多年过去了，如今这里高楼林立、车水马龙，变化之大可谓沧海桑田。\n开放是深圳与生俱来的基因。从边陲小镇到国际化大都市，从引进外资和技术到积极参与制定国际规则，今天的深圳，贸易联通四海，商旅络绎不绝，成为中国高水平对外开放的窗口。\n创新是深圳的活力所在。从出口加工到自主研发，从“世界工厂”到创新之城，今天的深圳，每年国际专利申请量近2万件，先进制造业和现代服务业比翼齐飞，成为中国集群式创新的前沿。\n合作是深圳的力量之源。“来了就是深圳人。”这座城市以宽广胸怀接纳四面八方的奋斗者，汇聚来自100多个国家和地区的国际化人才，成为中国同各方合作共赢的热土。\n深圳的故事是中国改革开放的缩影。一代代建设者在改革开放中破冰突围、接续奋斗，解放和发展生产力，展现了中国式现代化的万千气象。\n深圳的故事也是亚太合作的成功范例。亚太经济体突破地理限制和观念差异，积极投入区域合作的大舞台，创造了经济快速发展的“亚太奇迹”。\n女士们、先生们、朋友们！\n亚太经合组织成立以来，开放、创新、合作一直是其鲜明标识。从西雅图的初次握手到雁栖湖的历史盛会，从茂物目标的庄严承诺到亚太共同体的宏伟愿景，亚太经合组织始终把握时代脉搏、引领亚太经济一体化进程，助力亚太成为全球经济最具活力的地区和重要增长引擎。\n于道各努力，千里自同风。为了建设亚太共同体，我们跨越山海走到一起。中方担任今年亚太经合组织东道主以来，在16座城市举办了300多场会议和活动，各成员经济体代表逾万人次踊跃参与，为“中国年”收获更多重要成果作出贡献。在明天的领导人会议上，我们将讨论扩大相互开放的举措，探索创新驱动增长的路径，拓展各领域务实合作的机遇，推动更多成果落地。我期待同大家共商亚太合作大计、共襄亚太发展大业。\n现在，我提议，让我们一起举杯，\n为亚太地区的共同繁荣，\n为这次领导人非正式会议圆满成功，\n为各位嘉宾和家人的健康，干杯！", "s": "歓迎宴"}, {"t": "19:47", "d": "18", "c": ["露", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTISYcfBwjOTolmeJoICz9P261118.shtml", "ja": "【映像】習近平主席、プーチン大統領と会見（新華社発表と同内容のテレビ報道。出席は蔡奇・王毅・黄坤明各氏）", "o": "（動画の文字起こし・機械処理）\n11月18日,国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的俄罗斯总统普京。习近平指出,今年是中俄战略协作伙伴关系建立30周年,也是中俄穆林友好合作条约签署25周年。中俄关系既风雨不动安如山,又风雾长疑放眼凉,为变乱交織的世界提供了更多稳定性和确定性,树立了平等相待,相互尊重,重信手艺,合作共赢的新型大国关系典范。面向未来,双方要长保开拓进取的活力,不断发掘新时代中俄关系的潜力和内涵。坚持脚踏实地,深化两国全方位合作,坚定扛起大国应有的责任和担当,引领和推动世界多极化和国际关系民主化。习近平强调,双方要发挥两国政府立法机构、军队、党纪交往机制作用,确保两国元首达成的共识得到有效落实。中俄务实合作兼具相互信任的政治优势,发展振兴的共同目标、互利共赢的底层逻辑,应作优作强现有合作,拱固存量、拓展增量,提供更加稳定、可预期的投资和营商环境,保护好两国企业合法权益。中俄的发展,与亚太的发展紧密相连。亚太经合组织是加强合作的重要平台。中方愿同包括俄方在内的亚太大家庭一道,共谋亚太繁荣发展大计,写手构建亚太共同体。普京表示,热烈祝贺中国共产党20届五中全会成功召开。今年以来,我同习近平主席举行四次着有成效的会晤,推动俄中关系保持良好发展势头。双方高层交往密切,双边贸易额再上新高,各领域务实合作取得长足进展。俄中教育主题棉活动广泛开展,免签政策极大促进两国人员往来。俄方愿同中方加强被靠背战略协作,总结经验、规划未来、深入拓展、贸易、能源、教育等领域合作,扩大人文交流,更好造福两国人民。祝贺中方在深圳成功举办亚太经合组织领导人非正式会议。俄方愿同中方促进亚太地区发展合作,共同推进世界多极化进程,推动构建更加公正合理的全球治理体系,为维护国际关系稳定发挥重要作用。蔡奇、王毅、黄坤明等参加会见。", "s": "中ロ会談"}, {"t": "19:46", "d": "18", "c": ["露", "中"], "m": "TASS", "u": "https://tass.ru/politika/28330979", "ja": "ペスコフ大統領報道官：プーチン氏は習近平氏に特別軍事作戦地域（ウクライナ）の状況を説明した", "o": "Песков: Путин проинформировал Си Цзиньпина о ситуации в зоне СВО", "s": "中ロ会談"}, {"t": "19:50", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.com/politics/2220467", "ja": "ウシャコフ補佐官の発言まとめ：プーチン氏とトランプ氏は明日の全体会合とその直後に必ず会う。米ロ会談は少人数形式で大規模な代表団なし。三者会談では第二次大戦での協力や国連創設の経験、大国間関係の在り方を議論。ウィトコフ、クシュナー両氏は欧州で交渉中", "o": "FACTBOX: Russian presidential aide on Putin-Trump contacts, trilateral meeting with Xi\n- \"It has been decided that they will probably also meet during a gala dinner tonight, provided all the leaders attend. They will definitely meet tomorrow, at the APEC summit's plenary session and immediately afterward.\"\n- \"The number of participants will definitely be quite small. There will be no large delegations.\"\n- The three leaders may recall their countries' role in World War II and their participation in shaping the UN system.\n- \"The discussions will focus on how to further develop relations between the major powers...\"\n- US envoys Steve Witkoff and Jared Kushner are evidently conducting negotiations in Europe while keeping an eye on developments in Shenzhen.", "s": "米中ロ会談"}, {"t": "19:58", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIrsW7RAq0j0XWYl220U7e261118.shtml", "ja": "習近平主席の乾杯の辞（全文、新華社と同文）", "o": "", "s": "歓迎宴"}, {"t": "19:57", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.com/politics/2220481", "ja": "プーチン氏、レセプションでトランプ氏と短く言葉を交わす（TASS記者が現場から）。明日はプーチン、トランプ、習近平3氏が会談。トランプ氏の2期を通じて米ロ首脳の対面接触は8回目に", "o": "Russian President Vladimir Putin spoke briefly with US President Donald Trump at a Tuesday evening gala event, a TASS correspondent reports.\nThe reception is being held at the Shenzhen International Exchange Center on behalf of President of the People's Republic of China Xi Jinping in honor of the economic leaders of the APEC Forum.\nTomorrow, Putin, Trump and Xi will hold a meeting. The talks will be the eighth face-to-face contact between the leaders of Russia and the United States across Trump's two presidential terms.", "s": "歓迎宴"}, {"t": "19:54", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28330927", "ja": "ペスコフ報道官の発言まとめ：米ロ中首脳会談にロシアは「途方もない期待」はなく、現実的な期待。プーチン・トランプ両氏の本格会談の可能性にも言及（見出しとリードのみ。マレーシア紙The Starは「本格会談は見込み薄」と報道、本文で未確認）", "o": "Возможность полноформатных переговоров Путина и Трампа и позиция Европы. Заявления Пескова\nНевероятных ожиданий у России от предстоящей встречи лидеров России, США и КНР Владимира Путина, Дональда Трампа и Си Цзиньпина нет, они прагматические, указал представитель Кремля", "s": "米中ロ会談"}, {"t": "20:09", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/cdee9a9fdee246ae9ef29637591b6d0d/c.html", "ja": "【写真】新華社が集合写真などの写真ニュースを配信（説明文は既報と同じ）", "o": "11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n宴会开始前，习近平主席夫妇同各经济体领导人、代表及配偶集体合影。", "s": "歓迎宴"}, {"t": "20:25", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331099", "ja": "【映像】TASSがプーチン大統領の歓迎レセプション出席の映像を配信", "o": "Путин на приеме в честь участников саммита АТЭС. Видеотрансляция", "s": "歓迎宴"}, {"t": "20:25", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331147", "ja": "歓迎宴でのプーチン・トランプ両氏の接触は1年3カ月ぶりの対面。前回は2025年8月15日のアンカレジ（アラスカ）首脳会談", "o": "ТАСС: встреча Путина и Трампа стала первым очным контактом за год и три месяца\nДо саммита в Шэньчжэне лидеры РФ и США встречались в Анкоридже 15 августа 2025 года", "s": "米ロ会談"}, {"t": "20:35", "d": "18", "c": ["日", "米", "露", "中"], "m": "聯合ニュース", "u": "https://www.koreancenter.or.kr/", "ja": "聯合ニュースが「APEC歓迎晩餐会で記念撮影する中日首脳」「歓迎晩餐会で会った米中ロ首脳」の写真を配信（見出しのみ、写真・元記事は未確認。中国側は高市首相との接触に言及なし）", "o": "APEC 환영 만찬에서 기념 촬영하는 중ㆍ일 정상\nAPEC 환영 만찬에서 만난 미ㆍ중ㆍ러 정상\nAPEC 환영만찬 기념 촬영 마친 정상들", "s": "歓迎宴"}, {"t": "22:24", "d": "18", "c": ["日", "中"], "m": "ノーカットニュース", "u": "https://www.nocutnews.co.kr/news/6609130", "ja": "高市首相が先に習主席に歩み寄って手を差し出し、習主席は薄い笑みで握手に応じた。彭麗媛夫人との記念撮影でも習氏は薄い笑み。昨年11月の関係悪化後初の対面（韓国メディア。中国側は高市氏への言及なし）", "o": "다카이치 총리는 환한 표정으로 먼저 시 주석에게 다가가 손을 내밀었고, 시 주석은 옅은 미소를 띠고 악수에 응했다.\n펑리위안 여사와 함께한 기념사진 촬영에서 다카이치 총리는 밝은 미소를 보였고, 시 주석도 옅은 미소를 지었다.\n두 사람의 만남은 지난해 11월 다카이치 총리의 \"대만 유사시 개입\" 발언에 중국이 강력 반발하며 양국 관계가 얼어붙은 이후 처음이다.", "s": "歓迎宴"}, {"t": "22:24", "d": "18", "c": ["日", "中"], "m": "ファイナンシャルニュース", "u": "https://www.fnnews.com/news/202611182256436213", "ja": "高市首相が話しかけたが、習主席はうなずくだけ。中日首脳会談は難しい情勢（韓国メディア）", "o": "다카이치 말 걸었지만 시진핑 고개만 끄덕..중일 정상회담 난망", "s": "歓迎宴"}, {"t": "22:24", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIsuICbAaAqPX2NCjMxqrM261118.shtml", "ja": "【映像】CCTV独占映像：習近平主席夫妻が歓迎宴を開催、開宴前に各首脳と集合写真（ナレーションは新華社と同内容、首脳名の言及なし）", "o": "（動画の文字起こし・機械処理）\n11月18号,国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会。欢迎出席亚太经合组织第33次领导人非正式会议的原因。宴会开始前,习近平主席夫妇同各经济体领导人代表及配偶及体合影。", "s": "歓迎宴"}, {"t": "22:16", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28331585", "ja": "ウシャコフ補佐官：プーチン・習近平会談でトランプ氏との会合にも言及があった（見出しのみ）", "o": "Ушаков: встреча с Трампом упоминалась на переговорах Путина и Си Цзиньпина", "s": "米中ロ会談"}, {"t": "22:02", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "新華社（英語）", "u": "https://english.news.cn/20261118/924eb4cae64a4b85ad08e876efab7c37/c.html", "ja": "新華社英語版の更新版：宴会後、習近平主席夫妻は来賓とともに芸術公演を鑑賞した（首脳個別の言及なし）", "o": "Before the banquet, Xi and Peng posed for group photos with leaders and representatives from APEC economies and their spouses.\nAfter the banquet, they joined the guests to watch an artistic performance.", "s": "歓迎宴"}, {"t": "23:04", "d": "18", "c": ["露", "日"], "m": "TASS", "u": "https://tass.ru/politika/28331727", "ja": "ペスコフ報道官：プーチン氏は深圳で日本の首相との会談を予定していない", "o": "Песков: Путин в Шэньчжэне не планирует проводить встречу с премьером Японии", "s": ""}, {"t": "23:04", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331717", "ja": "ペスコフ報道官：プーチン氏とトランプ氏はAPECでまだ（じっくり）話ができていない（握手・短いあいさつは既報）", "o": "Песков: Путину и Трампу пока не удалось побеседовать на саммите АТЭС", "s": "米ロ会談"}, {"t": "23:05", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28331729", "ja": "ペスコフ報道官、ロ米中首脳会談の所要時間について説明（見出しのみ）", "o": "Песков рассказал о продолжительности саммита РФ, США и КНР", "s": "米中ロ会談"}, {"t": "23:03", "d": "18", "c": ["米", "露"], "m": "TASS（AP通信の引用）", "u": "https://tass.ru/mezhdunarodnaya-panorama/28331713", "ja": "AP通信：トランプ氏は三者会談に加え、APECの場でプーチン氏との個別会談を開きたい考え", "o": "AP: Трамп планирует отдельную встречу с Путиным на полях АТЭС в Китае\nПо сведениям агентства, американский президент хотел бы устроить двусторонние переговоры с российским лидером в дополнение к уже анонсированной трехсторонней встрече с председателем КНР Си Цзиньпином", "s": "米ロ会談"}, {"t": "23:07", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331737", "ja": "ペスコフ報道官：19日にプーチン・トランプ両氏の本格的な会談は予定されていない", "o": "Песков: полноформатные переговоры Путина и Трампа 19 ноября не планируются", "s": "米ロ会談"}, {"t": "23:13", "d": "18", "c": ["露", "日", "韓"], "m": "TASS", "u": "https://tass.ru/politika/28331749", "ja": "ペスコフ報道官：プーチン氏は深圳で韓国・日本の首脳と言葉を交わしていない", "o": "Песков: Путин не общался в Шэньчжэне с лидерами Республики Корея и Японии\nПресс-секретарь российского лидера рассказал об этом журналистам", "s": ""}, {"t": "23:24", "d": "18", "c": ["露", "米", "中"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261118/d5ddea231c1f426b82cf5649dbe7277b/c.html", "ja": "新華社写真ニュース：宴会前、習近平主席がプーチン大統領、トランプ大統領と交流（中国側が3者の接触を初めて明記）。ほかに乾杯の辞、来賓との記念撮影の写真", "o": "11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。这是习近平发表致辞。\n……这是习近平和彭丽媛同来宾们合影留念。\n……这是宴会前，习近平同俄罗斯总统普京、美国总统特朗普交流。", "s": "歓迎宴"}, {"t": "23:24", "d": "18", "c": ["米", "露", "日", "韓", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/18/ARTIEmI15NFxvqmbRe92ZL2S261118.shtml", "ja": "【詳報・映像】習近平主席夫妻、レッドカーペットで到着した各首脳を出迎え、親しく握手して記念撮影。乾杯の辞の要旨、宴会後に芸術公演を鑑賞。出席は蔡奇・王毅・何立峰・黄坤明・王小洪各氏ら（首脳個別の言及なし）", "o": "11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。\n香蜜湖畔，灯火璀璨，国际交流中心奏响亚太经合组织各成员经济体乐曲。\n各成员经济体领导人、代表及配偶，出席会议的国际组织负责人相继抵达，沿红毯前行。\n习近平和彭丽媛热情迎接，同他们亲切握手并合影留念。\n在悠扬的迎宾曲中，习近平和彭丽媛同来宾们共同步入宴会厅。\n习近平发表致辞，代表中国政府和中国人民热烈欢迎各位嘉宾来华出席亚太经合组织第三十三次领导人非正式会议。\n习近平指出，看千年的中国去西安，看五百年的中国去北京，看一百年的中国去上海，看五十年的中国来深圳。开放是深圳与生俱来的基因，创新是深圳的活力所在，合作是深圳的力量之源。深圳的故事是中国改革开放的缩影，也是亚太合作的成功范例。\n习近平强调，亚太经合组织成立以来，开放、创新、合作一直是其鲜明标识。从西雅图的初次握手到雁栖湖的历史盛会，从茂物目标的庄严承诺到亚太共同体的宏伟愿景，亚太经合组织始终把握时代脉搏、引领亚太经济一体化进程，助力亚太成为全球经济最具活力的地区和重要增长引擎。中方担任今年亚太经合组织东道主以来，在16座城市举办了300多场会议和活动，为“中国年”收获更多重要成果作出贡献，期待在明天的领导人会议上同各方共商亚太合作大计、共襄亚太发展大业。\n宴会后，习近平和彭丽媛同来宾们共同观看文艺演出，欣赏亚太文明交相辉映、美美与共的盛景，感受亚太共同体互利共赢、携手同心的和谐交响。\n蔡奇、王毅、何立峰、黄坤明、王小洪等出席活动。\n\n（動画の文字起こし・機械処理）\n11月18号晚,国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会,欢迎出席亚太经合组织第33次领导人非正式会议的来宾。悠阳的营兵曲中,习近平和彭丽媛同来宾们共同顾露宴会听。习近平发表致辞,代表中国政府和中国人民热烈欢迎各位嘉宾来华出席亚太经合组织第33次领导人非正式会议。亚太经合组织始终把握时代脉搏,引领亚太经济一体化进程,助力亚太成为全球经济最具活力的地区和重要增长引擎。中方担任今年亚太经合组织东道主义来,在十六座城市举办了三百多场会议和活动,为中国年收获更多重要成果作出贡献。", "s": "歓迎宴"}, {"t": "23:26", "d": "18", "c": ["露", "中"], "m": "TASS", "u": "https://tass.ru/politika/28331791", "ja": "ペスコフ報道官、習近平氏主催のレセプションを「いつものように」非常に温かいものだったと評価", "o": "Песков оценил прием от имени Си Цзиньпина с участием Путина\nПресс-секретарь президента России назвал встречу очень теплой, \"как всегда\"", "s": "歓迎宴"}, {"t": "23:32", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331815", "ja": "ウシャコフ補佐官：プーチン・トランプ両氏は19日のAPEC全体会合の後に会談する。二国間会談は中身のあるものになると期待", "o": "Ушаков: Путин и Трамп проведут встречу после пленарного заседания саммита АТЭС\nУшаков ожидает, что двусторонняя встреча Путина и Трампа будет содержательной", "s": "米ロ会談"}, {"t": "23:31", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28331811", "ja": "ペスコフ報道官：ロ米中の三者会談はそれ自体が重要。3首脳が「最も難しい問題を議論する際の対話の手本」を示す", "o": "Песков: трехсторонняя встреча РФ - США - КНР важна сама по себе\nПресс-секретарь президента России подчеркнул, что три лидера важнейших мировых государств собираются вместе, показывая \"пример общения при обсуждении самых сложных вопросов\"", "s": "米中ロ会談"}, {"t": "23:34", "d": "18", "c": ["露", "中"], "m": "TASS", "u": "https://tass.ru/politika/28331827", "ja": "ウシャコフ補佐官：プーチン・習近平両氏はアブダビでのウクライナを巡る交渉の話題に触れた。会話は同志的な雰囲気で、国際的な議題を協議、有益だった（中国側発表にウクライナ言及なし）", "o": "Ушаков назвал одну из тем беседы Путина и Си Цзиньпина на саммите АТЭС\nЛидеры России и КНР затрагивали тему переговоров по Украине в Абу-Даби, отметил помощник российского президента\nУшаков: беседа Путина и Си Цзиньпина прошла в товарищеской обстановке\nУшаков: Путин и Си Цзиньпин обсудили вопросы международной повестки\nУшаков назвал полезными переговоры Путина и Си Цзиньпина", "s": "中ロ会談"}, {"t": "23:33", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28331821", "ja": "プーチン、習近平、トランプの3氏は三者会談の所要時間を自ら決める", "o": "Путин, Си Цзиньпин и Трамп будут сами определять продолжительность встречи", "s": "米中ロ会談"}, {"t": "23:36", "d": "18", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28331837", "ja": "ウシャコフ補佐官：プーチン氏は深圳で多くの首脳と「二言三言」言葉を交わした（ペスコフ氏は韓国・日本の首脳とは言葉を交わしていないと説明）", "o": "Ушаков: Путин успел \"перекинуться парой слов\" со многими лидерами в Шэньчжэне", "s": "歓迎宴"}, {"t": "23:43", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331867", "ja": "プーチン・トランプ会談にはロ米両国の代表団が参加する。ウシャコフ補佐官は双方がすでに準備に入っていると説明（ペスコフ氏は先に「本格会談の予定なし」と説明）", "o": "Во встрече Путина и Трампа примут участие делегации от РФ и США\nУшаков ожидает, что двусторонняя встреча Путина и Трампа будет содержательной. Помощник президента РФ уточнил, что стороны уже готовятся к ней", "s": "米ロ会談"}, {"t": "23:39", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331847", "ja": "ウシャコフ補佐官：プーチン氏とトランプ氏は言葉を交わした", "o": "Ушаков: Путин и Трамп обменялись репликами", "s": "歓迎宴"}, {"t": "23:45", "d": "18", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331875", "ja": "ウシャコフ補佐官：宴会の食卓でプーチン氏とトランプ氏は隣同士ではなかった", "o": "Ушаков: за столом на торжественном приеме Путин и Трамп сидели не рядом", "s": "歓迎宴"}, {"t": "23:45", "d": "18", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28331873", "ja": "ウシャコフ補佐官：プーチン・トランプ・習近平3氏の会談の代表団は合意済み", "o": "Ушаков: согласованы делегации, которые будут на встрече Путина, Трампа и Си Цзиньпина", "s": "米中ロ会談"}, {"t": "00:49", "d": "19", "c": ["韓", "中"], "m": "新華社", "u": "https://www.news.cn/20261119/d57794b84b5d454a94ca1abba667a17d/c.html", "ja": "中国商務省：中韓FTA第2段階交渉（投資・サービス貿易・金融）が8年余りを経て実質妥結。ネガティブリスト方式で開放約束、正式署名へ準備（18日の習・李会談と同日発表）", "o": "新华社北京11月18日电（记者谢希瑶）商务部国际司负责人18日表示，中韩双方以两国元首重要共识为指引，推进中韩自贸协定第二阶段谈判，历经8年多时间，于近日实质性完成，达成互利共赢的高水平谈判成果。……下一步，在实质性完成谈判基础上，中韩双方将继续就协定最终文本涉及的技术细节进行全面梳理确认并完成文本翻译、法律审核等工作，为正式签署升级协定做好相关准备。", "s": "中韓会談"}, {"t": "01:00", "d": "19", "c": ["露", "中"], "m": "新華社", "u": "https://www.news.cn/20261119/9e13c5bd11d249f792e92706fc74fda7/c.html", "ja": "プーチン大統領、18日に深圳北理莫斯科大学（深圳MSU-BIT大学）を訪れ演説。ロ中両国の教員・学生がロ中の善隣友好関係に重要な貢献をしたと述べた（映像記事）", "o": "11月18日，俄罗斯总统普京在出席亚太经合组织（APEC）第三十三次领导人非正式会议期间参访深圳北理莫斯科大学并发表演讲。他表示，俄中两国师生们为俄中睦邻友好关系做出了重要贡献。", "s": ""}, {"t": "02:10", "d": "19", "c": ["露", "米"], "m": "TASS", "u": "https://tass.com/politics/2220773", "ja": "ペスコフ報道官：プーチン・トランプ会談は短時間。「両氏は短く話す。詳細は明日伝える」。本格会談は時間不足でこれまで設定できていない（ベドモスチ紙に）", "o": "The meeting between Russian President Vladimir Putin and US President Donald Trump will not last long, Kremlin Spokesman Dmitry Peskov told Vedomosti.\n\"They will talk briefly. Well, there's no point in guessing [how long the meeting will last]. We will provide all the details tomorrow,\" he told the newspaper.\nPeskov, responding to a question about the possibility of holding a full-format meeting between the two leaders, said that a lack of time had so far prevented such a meeting from being arranged.", "s": "米ロ会談"}, {"t": "03:22", "d": "19", "c": ["露", "日"], "m": "ランブレル（SCMPの引用）", "u": "https://news.rambler.ru/world/57441488-scmp-putin-provel-poluchasovoy-razgovor-s-premer-ministrom-yaponii-takaichi/", "ja": "ロシア各紙・SCMP：プーチン氏と高市首相が歓迎宴後に約30分会話。二国間関係、拘束中の日本人記者、JT資産の件を協議、7年ぶりの対面と報道。インタファクスは「日本政府が発表」と報道、ブルームバーグも報道。クレムリンは未確認（ペスコフ氏は18日夜「日本首脳とは言葉を交わしていない」）", "o": "SCMP: Путин провел получасовой разговор с премьер-министром Японии Такаичи\nПутин и премьер Японии Такаити провели первые личные переговоры на полях саммита АТЭС（Бизнес журнал）\nДавно не виделись: Такаити перехватила Путина на полях саммита АТЭС（EADaily）\nПутин и Такаити на АТЭС обсудили отношения России и Японии（Life.ru）", "s": "歓迎宴"}, {"t": "05:35", "d": "19", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/politika/28332527", "ja": "三者会談の時刻が明らかに：19日14:30（北京時間）、習近平氏の国家迎賓施設で（インタファクス）。ペスコフ報道官「1時間以内」", "o": "Названо время трехсторонней встречи Путина, Трампа и Си Цзиньпина\n（Интерфакс：Встреча Путина, Си Цзиньпина и Трампа назначена на 19 ноября в госрезиденции лидера КНР）", "s": "米中ロ会談"}, {"t": "06:09", "d": "19", "c": ["韓", "露"], "m": "コリア・ヘラルド", "u": "https://www.koreaherald.com/article/10941943", "ja": "韓国大統領府：李在明大統領とプーチン大統領が歓迎宴で約10分会話。協力の道を探ることで一致、朝鮮半島の緊張緩和の必要性を共有。中央日報は「7年ぶりの協議、北朝鮮問題も」（ペスコフ氏は前夜「韓日首脳とは言葉を交わしていない」と説明）", "o": "Lee, Putin seek room for cooperation in first meeting despite strains（The Korea Herald）\nSouth Korean, Russian leaders hold talks for first time in 7 years at APEC summit, discuss Pyongyang issue（Korea JoongAng Daily）", "s": "歓迎宴"}, {"t": "07:49", "d": "19", "c": ["韓", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/19/ARTIujfYdVrHnybzyZtnHaeb261119.shtml", "ja": "【映像】李在明大統領、18日のAPEC CEOサミットで演説。「未来は待っていて来るものではなく、挑戦する人々が共につくるもの」。昨年の慶州APECと深圳APECの理念は一貫していると述べた", "o": "为期两天的亚太经合组织工商领导人峰会在深圳举行。韩国总统李在明18日在峰会上发表致辞。\n李在明说：“去年，我们在庆州举办了APEC会议，主题是‘联通、创新、繁荣’。深圳APEC以‘开放、创新、合作’为核心议题。二者在理念上是一脉相承的。今天，我们相聚在深圳。这座城市生动展现了科技如何改变人们的生活。曾经仿佛遥不可及的未来科技，如今在这里正逐渐融入日常生活。未来不是等待而来的，而是由勇于探索挑战的人们携手创造的。在座的各位正是创造繁荣未来的主人公。希望大家携手努力，把连接四大洲21个经济体的2026年APEC打造成可以共创共同繁荣的舞台。”", "s": ""}, {"t": "08:36", "d": "19", "c": ["米", "露", "中"], "m": "TASS", "u": "https://tass.ru/mezhdunarodnaya-panorama/28332685", "ja": "トランプ氏、核兵器のさらなる削減は難しいと認める。米国は核弾頭を使いたくないと強調。イラン紛争の解決で助けを求めるつもりはないとも（発言の場は未確認）", "o": "Трамп признал сложность дальнейшего сокращения ядерного оружия. Американский президент заверил, что США не хотят применять атомные боеголовки\nТрамп заявил, что не собирается просить помощи в разрешении конфликта с Ираном", "s": "米中ロ会談"}, {"t": "08:40", "d": "19", "c": ["米", "露", "中"], "m": "TASS", "u": "https://tass.ru/mezhdunarodnaya-panorama/28332689", "ja": "トランプ氏：核兵器削減で合意すれば査察体制も可能。欧州がウクライナに供与する兵器の売却で米国が収入を得ていることも認めた", "o": "Трамп: режим инспекций возможен при достижении договоренностей сократить ядерное оружие\nТрамп признал доходы США от продажи вооружений, которые Европа поставляет Украине", "s": "米中ロ会談"}, {"t": "16:42", "d": "18", "c": ["米"], "m": "ホワイトハウス", "u": "https://www.whitehouse.gov/videos/president-donald-j-trump-arrives-in-shenzhen-china-where-hell-participate-in-the-apec-summit-%F0%9F%87%BA%F0%9F%87%B8/", "ja": "【映像】ホワイトハウス、トランプ大統領の深圳到着の映像を公開。「APEC首脳会議に参加し、世界の首脳との歴史的な会談に臨む」（19日09:50掲載確認）", "o": "President Donald J. Trump arrives in Shenzhen, China, where he'll participate in the APEC Summit.", "s": "到着・出迎え"}, {"t": "09:46", "d": "19", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28332783", "ja": "プーチン氏、APEC首脳会議の会場に到着", "o": "Путин прибыл на форум АТЭС", "s": "首脳会議"}, {"t": "09:53", "d": "19", "c": ["米", "露", "日", "韓", "中"], "m": "新華社（英語）", "u": "https://english.news.cn/20261119/eef210329e65406aa315990159552983/c.html", "ja": "習近平主席、APEC第33回非公式首脳会議の議長を務める（全体会合開始、速報）", "o": "SHENZHEN, Nov. 19 (Xinhua) -- Chinese President Xi Jinping on Thursday chaired the 33rd Asia-Pacific Economic Cooperation (APEC) Economic Leaders' Meeting in Shenzhen, south China's Guangdong Province.", "s": "首脳会議"}, {"t": "09:55", "d": "19", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28331789", "ja": "【映像】TASSが「プーチン氏、APEC首脳会議でトランプ氏ら各国首脳と会う」の映像中継を配信", "o": "Путин встречается с Трампом и другими лидерами на саммите АТЭС. Видеотрансляция", "s": "首脳会議"}, {"t": "09:54", "d": "19", "c": ["露", "米"], "m": "TASS", "u": "https://tass.ru/politika/28332787", "ja": "プーチン氏とトランプ氏、APEC2日目に再び握手", "o": "Путин и Трамп во второй день саммита АТЭС снова пожали друг другу руки", "s": "首脳会議"}, {"t": "09:56", "d": "19", "c": ["露", "韓"], "m": "TASS", "u": "https://tass.ru/mezhdunarodnaya-panorama/28332789", "ja": "韓国の李在明大統領、首脳会議前にプーチン氏のもとへあいさつに", "o": "Президент Республики Кореи подошел поздороваться к Путину перед саммитом АТЭС", "s": "首脳会議"}, {"t": "10:04", "d": "19", "c": ["米", "露", "日", "韓", "中"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261119/51f8ce473b174de78cdf4439c786dfe4/c.html", "ja": "習近平主席、非公式首脳会議を主宰し「アジア太平洋共同体を築き、『アジア太平洋の奇跡』の新章を書き続けよう」と題して重要演説（第1報）", "o": "新华社深圳11月19日电（记者孙奕、孙飞）11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议，并发表题为《建设亚太共同体，续写“亚太奇迹”新篇章》的重要讲话。", "s": "首脳会議"}, {"t": "10:07", "d": "19", "c": ["米", "露", "日", "韓", "中"], "m": "新華社（英語）", "u": "https://english.news.cn/20261119/3f080e3d1c2f4010babe1d9470239ee6/c.html", "ja": "習近平主席の演説の柱：団結と相互扶助、開放と融合、イノベーション、包摂的発展を特徴とするアジア太平洋共同体の構築を呼びかけ（英語版速報）", "o": "Chinese President Xi Jinping on Thursday called for further efforts to build an Asia-Pacific community that features solidarity and mutual assistance, openness and integration, innovation, and inclusive development.", "s": "首脳会議"}, {"t": "10:24", "d": "19", "c": ["米", "露", "日", "韓", "中"], "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261119/2d8b36bbb84e40908535853aaf21ff7a/c.html", "ja": "習近平主席の演説全文：アジア太平洋共同体の「四梁八柱」（経済貿易・連結性・イノベーション・発展の4本柱）を提唱。FTAAPを着実に推進。中国は2000万ドルを拠出、深圳にアジア太平洋共同体研究センターを設置。個別の国・問題への言及なし", "o": "新华社深圳11月19日电\n建设亚太共同体，续写“亚太奇迹”新篇章\n——在亚太经合组织第三十三次领导人非正式会议上的讲话\n（2026年11月19日，深圳）\n中华人民共和国主席　习近平\n各位同事：\n很高兴同大家相聚在美丽的深圳，共谋亚太合作大计。\n30多年前，亚太经合组织应运而生，开启了建设亚太共同体的壮阔历程。30多年来，亚太地区面貌日新月异，创造了经济快速发展的“亚太奇迹”。\n当前，世界百年变局加速演进，科技创新和产业创新方兴未艾。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n——建设亚太共同体，要坚持和衷共济。浩瀚的太平洋承载千帆、滋养万物，造就了亚太地区兼收并蓄、和合共生的磅礴气象。亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。\n——建设亚太共同体，要坚持开放融通。开放合作是亚太发展振兴的必由之路。要秉持开放的区域主义，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局。倡导自由开放的贸易和投资，打通要素流动堵点，畅通经济循环经脉，为亚太经济增长开拓更广阔空间。\n——建设亚太共同体，要坚持开拓创新。创新是引领发展的第一动力。要鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境。发扬进取精神，放大亚太经合组织孵化器作用，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。\n——建设亚太共同体，要坚持包容发展。亚太经济体多样性突出，发展诉求各异。要因势利导推进合作，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。\n各位同事！\n中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n第一，强化经贸支柱。亚太自由贸易区是亚太经合组织成员的共同愿景，要稳步向前推进，打造更高水平的开放格局。要推动区域经贸协定对接，提升贸易投资便利化、数字化水平，减少贸易投资壁垒。围绕亚太自贸区加强政策对话，开展经验交流和技术合作，提高各方参与高水平经贸安排的能力。\n第二，升级联通支柱。互联互通是区域经济一体化的纽带。2014年，我们共同制定亚太经合组织互联互通蓝图。今天，区域互联互通迎来新的机遇。要巩固“硬联通”，完善基础设施网络，推动智慧海关、智慧交通建设。增强“软联通”，促进政策和监管协调，深化跨境支付合作，维护产业链供应链稳定畅通。密切“心联通”，便利商旅和人员往来，促进人文交流和民众相知相亲。\n第三，打造创新支柱。数字经济和人工智能是创新增长的引擎。要加强数字基础设施建设，完善区域数据治理和协同合作，实现高效、便捷、安全的跨境数据流动。打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n第四，夯实发展支柱。面对层出不穷的全球性挑战，要加强能力建设，推动区域能源和粮食安全合作，深化跨境腐败治理。推动资源、环境、人口协调发展，加大自然资源合理利用和保护，拓展绿色低碳合作，实现经济可持续增长。支持改善民生和投资于人，实施健康老龄化行动，促进就业和职业技能开发，支持妇女经济赋权和青年人才交流，释放亚太人才活力。\n亚太是中国安身立命之所。中方将始终如一支持亚太合作。我宣布，中方将提供2000万美元，资助开展亚太经合组织务实合作。中方将在深圳设立亚太共同体研究中心，开展政策研究和交流，提供智力支撑。中方将立足亚太合作，在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。\n各位同事！\n深圳又名“鹏城”。期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。\n谢谢大家。", "s": "首脳会議"}, {"t": "10:24", "d": "19", "c": ["露", "米", "中"], "m": "TASS", "u": "https://tass.ru/mezhdunarodnaya-panorama/28332877", "ja": "APECの集合写真で、プーチン氏とトランプ氏が習近平主席の左右に並ぶ。撮影前に首脳らが握手", "o": "Путин и Трамп на \"фэмили-фото\" АТЭС встали справа и слева от Си Цзиньпина\nПеред началом церемонии лидеры обменялись рукопожатиями", "s": "首脳会議"}, {"t": "10:45", "d": "19", "c": ["米", "中"], "m": "CCTV", "u": "https://news.cctv.com/2026/11/19/ARTISj9Y4X9gHK1BcD0q2rLb261119.shtml", "ja": "【映像】トランプ大統領が首脳会議の会場（深圳国際交流中心）に到着（映像はナレーションなし）", "o": "11月19日上午，亚太经合组织第三十三次领导人非正式会议将在深圳国际交流中心举行。美国总统特朗普抵达会议现场。\n（動画の文字起こし：ナレーションなし）", "s": "首脳会議"}, {"t": "10:47", "d": "19", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28332925", "ja": "プーチン氏が全体会合で演説（7番目）：世界経済が分断される中でAPECは国々を結束させるべきだ。アジア太平洋のエコノミーとの協力はロシアの戦略的路線", "o": "Путин: в условиях фрагментации мировой экономики форум АТЭС должен объединять страны\nПутин назвал стратегическим курсом России партнерство с экономиками АТР\n（Путин принимает участие в пленарном заседании АТЭС. По протоколу мероприятия президент России выступит седьмым）", "s": "首脳会議"}, {"t": "10:48", "d": "19", "c": ["露"], "m": "TASS", "u": "https://tass.ru/politika/28332929", "ja": "プーチン氏：ロシアは深圳APEC首脳宣言の草案を支持する。ロシアは世界の主要経済国の一つで、世界に開かれ続ける", "o": "Путин: Россия поддерживает проект итоговой декларации саммита АТЭС в Шэньчжэне\nПутин: РФ остается открытой миру, усиливает свой экономический потенциал\nПутин: Россия входит в число ведущих экономик мира", "s": "首脳会議"}, {"t": "10:49", "d": "19", "c": ["米"], "m": "TASS", "u": "https://tass.ru/ekonomika/28332937", "ja": "トランプ氏：米国はAI分野の世界的な規制に反対する（全体会合での発言とみられる）", "o": "Трамп: США выступают против всемирного регулирования сферы ИИ", "s": "首脳会議"}, {"t": "11:50", "d": "19", "c": ["米", "露", "中"], "s": "首脳会議", "m": "ABCニュース", "u": "https://abcnews.com/Politics/live-updates/trump-asia-trip-2026/?id=138187702", "ja": "トランプ氏、全体会合の演説でこの後の米中ロ会談に言及しAI規制に反対。米当局者は19日の米ロ二国間会談の実施を確認", "o": "Trump touted his upcoming meeting with Putin and Xi in his plenary remarks and rejected AI regulation.\nA bilateral Trump–Putin meeting was scheduled for Thursday, US official confirms."}, {"t": "11:50", "d": "19", "c": ["米"], "s": "首脳会議", "m": "コリア・タイムズ", "u": "https://www.koreatimes.co.kr/foreignaffairs/20261119/trump-stresses-caution-in-managing-ai-risks-at-apec-summit", "ja": "トランプ氏、全体会合で先端AIの管理に慎重さを強調。超知能は産業革命以来最大の技術転換。開発を妨げる世界的規制には反対。アジア太平洋の安定と繁栄への支持を改めて表明", "o": "Trump stresses caution in managing AI risks at APEC summit"}, {"t": "11:58", "d": "19", "c": ["米", "中"], "s": "首脳会議", "m": "Fox News", "u": "https://www.foxnews.com/live-news/trump-to-meet-xi-in-shenzhen-ahead-of-high-stakes-trilateral-talks-with-putin", "ja": "トランプ氏、全体会合で習主席を「信じられないほどの指導者」と称賛。「習主席と彭夫人の素晴らしい催しに感謝。昨夜は信じられないほどだった」", "o": "\"I want to thank President XI and Madame Peng for the incredible display that they put forth. Last night was unbelievable. It was really unbelievable. And once again, for hosting us, as well as all the leaders here who seek to join a forging and safer and more prosperous world,\"\n\"This is an incredible country. You've done an unbelievable job, and you're an incredible leader. Thank you very much,\" Trump said to Xi."}, {"t": "12:00", "d": "19", "c": ["米", "中"], "s": "首脳会議", "m": "Fox News", "u": "https://www.foxnews.com/live-news/trump-to-meet-xi-in-shenzhen-ahead-of-high-stakes-trilateral-talks-with-putin", "ja": "トランプ氏演説「米国は超知能（SI）の世界的リーダー。SIは産業革命以来最大の変革」「悪い要素もあり注意が必要だが、グローバリスト的規制は許さない」", "o": "\"The United States is also proud to be the world leader in superintelligence. SI the greatest technological transformation since the industrial revolution...\"\n\"But we have to watch it. We have to be careful... It's almost completely good, but it's got some bad elements... So we oppose any form of globalist regulation or anything to control or stifle SI, and we won't allow that to happen.\""}, {"t": "12:05", "d": "19", "c": ["露"], "s": "首脳会議", "m": "TASS", "u": "https://tass.com/economy/2220915", "ja": "プーチン氏が全体会合で演説：ロシアはAPECのパートナーと過去数十年で80件超の大型事業を実施。農業生産・貿易、電子政府、女性起業などの分野で、今後も積極的に参加する", "o": "Russia and its partners in APEC have implemented more than 80 major projects over recent decades, Putin said at the APEC plenary session. \"We will continue to work together with our partners in the forum to implement joint, mutually beneficial projects and initiatives. Over the past decades, more than 80 such projects have been implemented, and I am referring only to large-scale ones, including in the areas of agricultural production and trade, the e-government services, and women's entrepreneurship.\""}, {"t": "12:08", "d": "19", "c": ["露", "米", "中"], "s": "米中ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333133", "ja": "ドミトリエフ大統領特別代表、この後予定される露中米首脳会談を「歴史的」と評価", "o": "Дмитриев назвал исторической предстоящую встречу лидеров РФ, КНР и США"}, {"t": "12:15", "d": "19", "c": ["露", "中"], "s": "首脳会議", "m": "TASS", "u": "https://tass.com/politics/2220917", "ja": "プーチン氏が全体会合で演説：議長国・中国の働きを最大限に称賛し、中国のスローガンを全面的に支持。演説の締めくくりで習主席らの歓待に謝意を示し、2027年の議長国ベトナムの成功を祈る", "o": "\"First and foremost, I would like to express my highest praise for China's work as the APEC chair this year. We fully endorse the slogan of the Chinese chairmanship: 'Forging Ahead with Resolve Toward a Bright Future for the Asia-Pacific'.\" Concluding his speech, the Russian leader thanked Chinese President Xi Jinping and all his Chinese friends for their hospitality and productive joint work. \"And I wish Vietnam success as it assumes the APEC chairmanship in 2027.\""}, {"t": "12:25", "d": "19", "c": ["中"], "s": "首脳会議", "m": "新華社", "u": "https://www.news.cn/politics/leaders/20261119/b7cba8b666b44bf6bf8000bf4cee45ef/c.html", "ja": "【詳報】首脳会議が閉幕。2026年APEC首脳宣言と「深圳展望」、貿易・連結性・イノベーションの成果文書3件を全会一致で採択。習主席は総括発言で「自信を固める・方向を見定める・実務に徹する」の3点を主張。中国はAPEC協力に2000万ドル拠出、深圳にアジア太平洋共同体研究センターを設置。次期議長国はベトナム", "o": "新华社深圳11月19日电（记者徐寿松、孙奕）11月19日上午，国家主席习近平在深圳国际交流中心主持亚太经合组织第三十三次领导人非正式会议，并发表题为《建设亚太共同体，续写“亚太奇迹”新篇章》的重要讲话。\n11月的深圳，微风送爽，鲜花盛开。\n习近平热情迎接与会的各经济体领导人、代表及国际组织负责人，同他们亲切握手并集体合影，随后主持会议。\n习近平指出，30多年前，亚太经合组织应运而生，开启了建设亚太共同体的壮阔历程。30多年来，亚太地区面貌日新月异，创造了经济快速发展的“亚太奇迹”。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n一要坚持和衷共济，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。二要坚持开放融通，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局，倡导自由开放的贸易和投资，为亚太经济增长开拓更广阔空间。三要坚持开拓创新，鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。四要坚持包容发展，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。\n习近平强调，中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n第一，强化经贸支柱。亚太自由贸易区是亚太经合组织成员的共同愿景，要稳步向前推进，打造更高水平的开放格局。推动区域经贸协定对接，提升贸易投资便利化、数字化水平，减少贸易投资壁垒。加强政策对话，开展经验交流和技术合作，提高各方参与高水平经贸安排的能力。\n第二，升级联通支柱。互联互通是区域经济一体化的纽带。要巩固“硬联通”，完善基础设施网络；增强“软联通”，促进政策和监管协调；密切“心联通”，便利商旅和人员往来，促进人文交流和民众相知相亲。\n第三，打造创新支柱。数字经济和人工智能是创新增长的引擎。要加强数字基础设施建设，完善区域数据治理和协同合作，实现高效、便捷、安全的跨境数据流动。打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n第四，夯实发展支柱。要加强能力建设，推动区域能源和粮食安全合作，深化跨境腐败治理。推动资源、环境、人口协调发展，拓展绿色低碳合作，实现经济可持续增长。支持改善民生和投资于人，实施健康老龄化行动，促进就业和职业技能开发，支持妇女经济赋权和青年人才交流，释放亚太人才活力。\n习近平宣布中方支持亚太合作的最新举措，包括提供2000万美元资助开展亚太经合组织务实合作；在深圳设立亚太共同体研究中心，开展政策研究和交流，提供智力支撑；在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。\n各经济体领导人及代表围绕会议主题“建设亚太共同体，促进共同繁荣”依次发言。各方高度评价APEC“中国年”取得的丰硕成果，感谢中方所做出色工作，积极呼应习近平主席提出的重大倡议举措。各方表示，愿密切各领域合作，携手应对风险挑战，推动亚太经合组织实现更大发展，为地区和世界的和平、稳定、繁荣作出贡献。国际货币基金组织总裁格奥尔基耶娃应邀介绍当前全球经济形势。\n习近平听取各方发言后作总结发言，就高质量推进亚太合作提出3点主张：一是坚定信心，努力将建设亚太共同体的共识转化为行动，把愿景变为现实。二是把准方向，始终锚定建设亚太共同体的大方向不动摇，以强烈的使命感推进各领域合作，携手创造亚太更加美好的未来，推动构建人类命运共同体。三是实干笃行，抓住发展这个最大公约数，尊重规律、真抓实干、善作善成，不断取得可感可及的亚太合作成果。\n会议最后进行东道主交接，2027年亚太经合组织东道主越南国家主席苏林欢迎各经济体领导人、代表明年前往越南出席会议。\n会议一致通过2026年亚太经合组织领导人宣言，就亚太共同体建设提出“深圳展望”，以及贸易、联通、创新领域3项成果文件。\n蔡奇、王毅出席。"}, {"t": "12:24", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333165", "ja": "【速報】プーチン氏がトランプ氏との会談を開始。2025年8月のアンカレッジ首脳会談以来、初の対面接触", "o": "Путин начал встречу с Трампом. Это первый очный контакт лидеров Росси и США с саммита в Анкоридже в августе 2025 года"}, {"t": "12:25", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333169", "ja": "プーチン氏、トランプ氏との会談の冒頭公開部分で発言せず", "o": "Путин не стал делать заявлений в открытой части встречи с Трампом"}, {"t": "12:26", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333171", "ja": "プーチン・トランプ会談の公開部分は約1分で終了", "o": "Публичная часть встречи Путина и Трампа продлилась около 1 минуты"}, {"t": "12:27", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333173", "ja": "プーチン、トランプ両氏が二国間会談の冒頭で再び握手（全体会合前にも握手）", "o": "Путин и Трамп в начале двусторонней встречи снова пожали друг другу руки. Лидеры России и США уже обменивались рукопожатиями перед пленарным заседанием саммита АТЭС"}, {"t": "12:28", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/mezhdunarodnaya-panorama/28333179", "ja": "トランプ氏、プーチン氏との会談で「素晴らしい関係」にあると発言", "o": "Трамп на встрече с Путиным заявил об \"отличных отношениях\" с российским президентом"}, {"t": "12:29", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333181", "ja": "米ロ会談にロシア側からラブロフ外相、シルアノフ財務相、ウシャコフ補佐官、ドミトリエフ特別代表が参加", "o": "Лавров, Силуанов, Ушаков и Дмитриев участвуют во встрече Путина и Трампа"}, {"t": "12:30", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333183", "ja": "プーチン・トランプ会談は逐次通訳で進行", "o": "На встрече Путина и Трампа организовали последовательный перевод"}, {"t": "12:30", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/mezhdunarodnaya-panorama/28333187", "ja": "トランプ氏、プーチン氏との会談で「素晴らしい成果が得られうる」と発言", "o": "Трамп заявил, что на встрече с Путиным могут быть достигнуты отличные результаты"}, {"t": "12:40", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "NBCニュース", "u": "https://www.nbcnews.com/politics/trump-administration/live-blog/trump-xi-putin-china-apec-congress-2026-live-updates-rcna609888#rcrd124238", "ja": "米ロ会談の会場は麒麟山荘。トランプ氏「長年素晴らしい関係にある。ここから多くの素晴らしいことが生まれる、少なくとも始まる」。プーチン氏は発言せず笑顔で立つ", "o": "Trump and Putin have begun their bilateral talks ahead of a historic trilateral meeting with Xi. \"We have had a great relationship for many years. We've known each other for a long time,\" Trump said after entering the room at Kylin Villa in Shenzhen. He shook Putin's hand and stood in front of a white couch next to the American flag. \"A lot of wonderful things can come out of this or at least start,\" Trump said. Putin did not give any remarks, instead standing with a smile next to his country's flag."}, {"t": "12:45", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "TASS", "u": "https://tass.com/politics/2220943", "ja": "米ロ会談の同席者：米側はルビオ国務長官とベッセント財務長官、ロ側はラブロフ外相・シルアノフ財務相・ウシャコフ補佐官・ドミトリエフ特別代表。会談は三者会談前の短時間のもの", "o": "Russian Foreign Minister Sergey Lavrov, Deputy Prime Minister and Finance Minister Anton Siluanov, Kremlin aide Yury Ushakov and Special Envoy Kirill Dmitriev took part in the meeting between Russian President Vladimir Putin and his US counterpart Donald Trump, a TASS correspondent reported. The brief meeting between the two leaders is taking place ahead of a trilateral meeting with Chinese President Xi Jinping. The US is represented by State Secretary Marco Rubio and Treasury Secretary Scott Bessent."}, {"t": "12:48", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/mezhdunarodnaya-panorama/28333221", "ja": "トランプ氏、APEC首脳会議の舞台裏でペスコフ大統領報道官にあいさつ", "o": "Трамп поприветствовал Пескова в кулуарах саммита АТЭС"}, {"t": "12:51", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/mezhdunarodnaya-panorama/28333233", "ja": "トランプ氏、プーチン氏との会談で同氏を「友人」と呼び、会えてうれしいと強調", "o": "Трамп на встрече с Путиным назвал российского лидера своим другом. Американский лидер подчеркнул, что рад видеть президента России"}, {"t": "12:55", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333245", "ja": "プーチン、トランプ両氏、会談の冒頭で英語で短く言葉を交わす。あいさつの後に握手", "o": "Путин и Трамп в начале встречи обменялись короткими репликами на английском. Лидеры России и США пожали друг другу руки после приветствия"}, {"t": "13:09", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "CNN", "u": "https://www.cnn.com/2026/11/17/politics/live-news/trump-visit-china-philippines?post-id=cmwn36xz700153b6t4rozj3xy", "ja": "【速報】米ロ会談が約40分で終了（CNN・NBC）。ホワイトハウスは二国間会談より略式の「プル・アサイド」と位置づけ", "o": "The meeting between Presidents Trump and Putin ended after roughly 40 minutes. Trump was seen departing the area where the two leaders had been talking. The talks were described by the White House as a \"pull-aside\" – a less formal designation than a bilateral meeting."}, {"t": "13:12", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/mezhdunarodnaya-panorama/28333329", "ja": "深圳でのプーチン・トランプ会談が終了（ロシア側も確認）", "o": "Встреча Путина и Трампа в Шэньчжэне завершилась"}, {"t": "13:15", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "ТАСС", "u": "https://tass.ru/politika/28333351", "ja": "プーチン、トランプ両氏は会談後、報道陣向けの共同声明を出さなかった", "o": "Путин и Трамп не стали делать совместных заявлений для СМИ по итогам встречи"}, {"t": "13:22", "d": "19", "c": ["米", "中"], "s": "米中会談", "m": "CCTV", "u": "https://news.cctv.com/2026/11/19/ARTIYRzCMa9rNGkn9Ex99I40261119.shtml", "ja": "【映像】習主席、19日深圳でトランプ大統領と会見へ。会見場の名札によると米側はルビオ国務長官、ベッセント財務長官、ラトニック商務長官、グリア通商代表らが同席（CCTVの現場リポート、機械文字起こしによる）", "o": "11月19日，国家主席习近平将在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n【文字起こし（機械）】我们现在来到了举行今天中美元首会晤的会见厅……从会议桌上摆放的桌牌可以看到……美国国务卿卢比奥、美国的财政部长贝森特、商务部长卢特尼克还有美国贸易代表格里尔等都将参加今天的中美元首会晤……"}, {"t": "13:27", "d": "19", "c": ["露", "米"], "s": "米ロ会談", "m": "TASS", "u": "https://tass.com/world/2220959", "ja": "米ロ会談は1時間弱。現地時間12:15ごろ始まり、ホワイトハウス代表取材団によると13:00ごろ終了。トランプ氏の2期を通じて8回目の対面会談で、2期目では2回目（前回は15か月前のアンカレッジ）", "o": "The meeting between Russian President Vladimir Putin and his US counterpart Donald Trump on the sidelines of the APEC summit lasted less than an hour, a TASS correspondent reported. It began at approximately 12:15 p.m. local time (4:15 a.m. GMT). The White House press pool announced its conclusion around 5:00 a.m. GMT. This was the eighth face-to-face meeting between the Russian and US leaders during Trump's two presidential terms. It is the second since Trump returned to the White House. The last time the Russian and US leaders met was 15 months ago in Anchorage."}, {"t": "13:33", "d": "19", "c": ["米", "中"], "s": "米中会談", "m": "新華社（英語）", "u": "h <script>
(function () {
  var items = JSON.parse(document.getElementById("feed").textContent);
  function mins(it) { var p = it.t.split(":"); return (parseInt(it.d || "18", 10) - 17) * 1440 + parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
  items.forEach(function (it) { it._m = mins(it); });
  items.sort(function (a, b) { return b._m - a._m; });

  function key(it) { var m = it.ja.replace(/^【[^】]*】/, "").match(SPK); return it.m + "|" + (m ? m[1] : "") + "|" + (it.s || ""); }
  var list = document.getElementById("list");
  var cBtns = Array.prototype.slice.call(document.querySelectorAll(".bar button[data-c]"));
  var sBtns = Array.prototype.slice.call(document.querySelectorAll(".bar button[data-s]"));
  var curC = "", curS = "";
  var PAGE = 20, limit = PAGE;
  try { limit = Math.max(PAGE, parseInt(sessionStorage.getItem("apec-limit"), 10) || PAGE); } catch (e) {}
  try { curC = localStorage.getItem("apec-filter") || ""; curS = localStorage.getItem("apec-scene") || ""; } catch (e) {}
  function saveLimit() { try { sessionStorage.setItem("apec-limit", String(limit)); } catch (e) {} }
  var moreBtn = document.getElementById("more");
  function el(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
  function tl(it) { return (it.d && it.d !== "18" ? it.d + "日 " : "") + it.t; }
  var KEEP = { "映像": "映像", "動画": "映像", "写真": "写真", "詳報": "詳報", "速報": "速報" };
  function cleanJa(t) {
    return t.replace(/^【([^】]*)】\s*/, function (_, tag) {
      var out = [];
      tag.split(/[・\/]/).forEach(function (k) { var v = KEEP[k.trim()]; if (v && out.indexOf(v) < 0) out.push(v); });
      return out.length ? "【" + out.join("・") + "】" : "";
    });
  }
  function jaLine(it, cls) {
    var ja = el("p", cls || "ja", cleanJa(it.ja));
    var a = el("a", null, it.m); a.href = it.u; a.target = "_blank"; a.rel = "noopener";
    ja.appendChild(document.createTextNode("（")); ja.appendChild(a); ja.appendChild(document.createTextNode("）"));
    return ja;
  }
  function orig(it) {
    if (!it.o) return null;
    var det = el("details", "orig"); det.appendChild(el("summary", null, "原文")); det.appendChild(el("p", "o", it.o)); return det;
  }
  function match(it) { return (!curC || it.c.indexOf(curC) >= 0) && (!curS || it.s === curS); }
  function group(arr) {
    var out = [], open = {};
    arr.forEach(function (it) {
      var k = key(it), g = open[k];
      if (g && g.head._m - it._m <= 30) { g.rest.push(it); }
      else { g = { head: it, rest: [] }; open[k] = g; out.push(g); }
    });
    return out;
  }
  function render() {
    list.textContent = "";
    var shown = items.filter(match);
    var groups = group(shown);
    if (!groups.length) list.appendChild(el("li", "empty", "該当する速報はまだありません。"));
    var rest = Math.max(0, groups.length - limit);
    groups.slice(0, limit).forEach(function (g) {
      var it = g.head;
      var li = el("li", "item");
      li.appendChild(el("div", "time", tl(it)));
      var b = el("div", "body");
      var tags = el("div", "tags");
      [].concat(typeof it.c === "string" ? it.c.split("") : (it.c || [])).forEach(function (c) { tags.appendChild(el("span", "tag " + c, c)); });
      if (it.s) tags.appendChild(el("span", "scene", it.s));
      b.appendChild(tags);
      b.appendChild(jaLine(it));
      var o = orig(it); if (o) b.appendChild(o);
      if (g.rest.length) {
        var th = el("details", "thread");
        th.appendChild(el("summary", null, "これまでの内容（" + g.rest.length + "件）"));
        var ul = el("ol", "sub");
        g.rest.forEach(function (r) {
          var sli = el("li");
          var p = jaLine(r, "ja"); p.insertBefore(el("span", "st", tl(r)), p.firstChild);
          sli.appendChild(p);
          var ro = orig(r); if (ro) sli.appendChild(ro);

        });
        th.appendChild(ul);
        b.appendChild(th);
      }
      li.appendChild(b);
      list.appendChild(li);
    });
    moreBtn.hidden = rest === 0;
    moreBtn.textContent = "続きを表示する（残り" + rest + "件）";
    cBtns.forEach(function (bt) {
      var c = bt.getAttribute("data-c");
      bt.setAttribute("aria-pressed", String(c === curC));
      bt.querySelector(".n").textContent = items.filter(function (it) { return (!c || it.c.indexOf(c) >= 0) && (!curS || it.s === curS); }).length;
    });

  sBtns.forEach(function (bt) { bt.addEventListener("click", function () {

  render();
})();
</script>
