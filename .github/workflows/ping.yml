name: ping

# Every 5 minutes (GitHub may delay scheduled runs): look for new items on three public
# government release lists and, if any, start the analysis workflow in another repository.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: python3 ping.py
      - name: Save seen list
        run: |
          git diff --quiet seen.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "seen" seen.json
          git pull -q --rebase && git push -q
